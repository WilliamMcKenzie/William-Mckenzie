<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <title>wqm</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                color: white;
            }
            #bg {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
            }
            .canvas {
                position: fixed;
            }
            .smiley {
                width: 96px;
                height: 96px;
                z-index: 1;
                position: absolute;
                top: 0;
                left: 0;
            }
            .links {
                position: absolute;
                top: 0;
                right: 0;
                z-index: 10;
                padding: 1rem;
                background-color: red;
            }
            .info {
                position: absolute;
                bottom: 0;
                right: 0;
                z-index: 10;
                padding: 1rem;
                text-align: end;
            }
            a {
                color: white;
                padding-left: 0.5rem;
            }
        </style>
    </head>
    <body>
        <img class="smiley" src="/smiley.png">
        <img id="bg" alt="">
        <div class="links">
            <a class="spaced" href="/writing">writing</a>
            <a class="spaced" href="/gallery">gallery</a>
            <a class="spaced" href="https://github.com/WilliamMcKenzie?tab=repositories">github</a>
            <a class="spaced" href="https://www.linkedin.com/in/williamckenzie/">linkedin</a>
        </div>
        <div class="info">
            <p>
                studying cs @uwaterloo
            </p>
            <p>
                working on integrating ai in games @viggle
            </p>
            <p>
                interested in multiplayer games, procedural generation and pixel art
            </p>
        </div>
        <canvas class="canvas"></canvas>
        <script>
            const bgs = [
                "youth_lg.jpg",
            ]
            const pick = bgs[Math.floor(Math.random() * bgs.length)]
            document.getElementById("bg").src = "/bgs/" + encodeURIComponent(pick)
        </script>
        <script src="bg.js"></script>
    </body>
</html>
