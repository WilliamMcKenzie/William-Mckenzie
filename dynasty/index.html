<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <title>dynasty</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                background-color: #000;
            }
            #bg {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
            }
        </style>
    </head>
    <body>
        <img id="bg" alt="">
        <script>
            const bgs = [
                "arcadia.jpg",
                "architect.jpg",
                "laggero.jpg",
                "return.jpg",
                "youth.jpg",
            ]
            const pick = bgs[Math.floor(Math.random() * bgs.length)]
            document.getElementById("bg").src = "/bgs/" + encodeURIComponent(pick)
        </script>
    </body>
</html>
