<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <title>dynasty</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                background-color: #000;
            }
            #bg {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
            }
        </style>
    </head>
    <body>
        <img id="bg" alt="">
        <script>
            const bgs = [
                "The_Return_A31154.jpg",
                "Thomas_Cole_-_Architect’s_Dream_-_Google_Art_Project.jpg",
                "Thomas_Cole_-_Dream_of_Arcadia_-_Google_Art_Project.jpg",
                "Thomas_Cole_-_L'Allegro.jpg",
                "Thomas_Cole_-_The_Voyage_of_Life_Childhood,_1842_(National_Gallery_of_Art).jpg",
                "Thomas_Cole_-_The_Voyage_of_Life_Manhood,_1842_(National_Gallery_of_Art).jpg",
                "Thomas_Cole_-_The_Voyage_of_Life_Old_Age,_1842_(National_Gallery_of_Art).jpg",
                "Thomas_Cole_-_The_Voyage_of_Life_Youth,_1842_(National_Gallery_of_Art).jpg",
            ]
            const pick = bgs[Math.floor(Math.random() * bgs.length)]
            document.getElementById("bg").src = "/bgs/" + encodeURIComponent(pick)
        </script>
    </body>
</html>
