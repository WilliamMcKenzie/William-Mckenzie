<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/gallery/styles.css">
    <title>WQM</title>
</head>
<body>
    <canvas class="canvas"></canvas>
    <div class="container transparent">
        <h3>
            Fractals (+/- to zoom, WASD to move)
        </h3>
        <button onclick="window.location.href = '/gallery/soundwave'" class="btn">
            Next
        </button>
        <button onclick="window.location.href = '/'" class="btn">
            Home
        </button>
        <small_break></small_break>
        <button onclick="setEscapeTime(mendelbrot)" class="btn">
            Mendelbrot's set
        </button>
        <button onclick="setEscapeTime(flame)" class="btn">
            Big bang
        </button>
        <button onclick="setEscapeTime(strange)" class="btn">
            Into the seahorse
        </button>
        <full_break></full_break>
        <button onclick="setColors(3)" class="btn">
            Colors1
        </button>
        <button onclick="setColors(2)" class="btn">
            Colors2
        </button>
        <button onclick="setColors(1)" class="btn">
            Colors3
        </button>
    </div>
    <script src="/gallery/fractals/fractal.js"></script>
</body>
</html>
