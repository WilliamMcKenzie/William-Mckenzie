<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/gallery/styles.css">
    <title>WQM</title>
</head>
<body>
    <canvas class="canvas"></canvas>
    <div class="container transparent">
        <h3>
            Yingyang (click for special effect)
        </h3>
        <button onclick="window.location.href = '/gallery/boat'" class="btn">
            Next
        </button>
        <button onclick="window.location.href = '/'" class="btn">
            Home
        </button>
    </div>
    <script src="/gallery/yingyang/yingyang.js"></script>
    <script>
        document.addEventListener("mousedown", (_) => {
            changebg(orangbg)
            fill = "rgba(2, 125, 156, 0.3)"
            frequency = 1
        })
        document.addEventListener("mouseup", (_) => {
            changebg(tealbg)
            fill = "rgba(255, 255, 255, 0.1)"
            frequency = 1/4000
        })
    </script>
</body>
</html>
