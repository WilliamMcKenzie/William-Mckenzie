<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <title>WQM</title>
</head>
<body>
    <canvas class="canvas"></canvas>
    <button onclick="window.location.href = '/gallery/yingyang'" class="bg-button">
        Next
    </button>
    <button onclick="window.location.href = '/'" class="bg-button" style="top: 6rem">
        Home
    </button>
    <h3>
        Vortex (click for special effect)
    </h3>
    <script id="background-script" src="/gallery/vortex/vortex.js"></script>
    <script>
        document.addEventListener("mousedown", (_) => {
            changebg(orangbg)
            stretchCoefficient = 1.5
            fill = "rgba(2, 125, 156, 0.3)"
            frequency = 11
            setTimeout(() => {
                speedCoefficient = 1.25
                setTimeout(() => {
                    speedCoefficient = 1.5
                }, 50)
            }, 50)
        })
        document.addEventListener("mouseup", (_) => {
            changebg(tealbg)
            stretchCoefficient = 1
            fill = "rgba(255, 255, 255, 0.1)"
            frequency = 77
            setTimeout(() => {
                speedCoefficient = 1.25
                setTimeout(() => {
                    speedCoefficient = 1
                }, 50)
            }, 50)
        })
    </script>
</body>
</html>
