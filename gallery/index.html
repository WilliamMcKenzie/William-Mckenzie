<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <title>gall</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                color: white;
            }
            #bg {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
            }
            .canvas {
                position: fixed;
            }
            .smiley {
                width: 96px;
                height: 96px;
                z-index: 1;
                position: absolute;
                top: 0;
                left: 0;
            }
            .links {
                position: absolute;
                top: 0;
                right: 0;
                z-index: 10;
                padding: 1rem;
                background-color: red;
            }
            .info {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background-color: red;
                border: 10px solid red;
                z-index: 10;
                padding: 1rem;
                text-align: end;
            }
            a {
                color: white;
                padding-left: 0.5rem;
            }
        </style>
    </head>
    <body>
        <img class="smiley" src="/smiley.png">
        <div class="links">
            <a class="spaced" href="/">home</a>
            <a class="spaced" href="/writing">writing</a>
            <a class="spaced" href="https://github.com/WilliamMcKenzie?tab=repositories">github</a>
            <a class="spaced" href="https://www.linkedin.com/in/williamckenzie/">linkedin</a>
        </div>
        <img id="bg" alt="">
        <table class="info">
