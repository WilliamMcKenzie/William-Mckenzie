<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <title>WQM</title>
</head>
<body>
    <canvas class="canvas"></canvas>
    <button onclick="window.location.href = '/gallery/fractals'" class="bg-button">
        Next
    </button>
    <button onclick="window.location.href = '/'" class="bg-button" style="top: 6rem">
        Home
    </button>
    <button onclick="newDiagram()" class="bg-button" style="top: 10rem">
        New
    </button>
    <div class="bg-container" style="top: 12rem">
        <button style="background-color: transparent; color: #fff;">Points:</button>
        <input id="count" onchange="change()" placeholder="# of pts" type="number">
    </div>
    <h3>
        Vornoi
    </h3>
    <script src="/gallery/vornoi/vornoi.js"></script>
    <script>
        function newDiagram() {
            reset()
            makePoints()
            animate()
        }

        function change() {
            count = document.getElementById("count").value
            newDiagram()
        }

        newDiagram()
    </script>
</body>
</html>
