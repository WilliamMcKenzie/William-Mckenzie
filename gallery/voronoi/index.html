<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/gallery/styles.css">
    <title>WQM</title>
</head>
<body>
    <canvas class="canvas"></canvas>
    <div class="container">
        <h3>
            Voronoi
        </h3>
        <button onclick="window.location.href = '/gallery/fractals'" class="btn">
            Next
        </button>
        <button onclick="window.location.href = '/'" class="btn">
            Home
        </button>
        <small_break></small_break>
        <button onclick="newDiagram()" class="btn">
            New diagram
        </button>
        <input class="input" id="count" onchange="change()" placeholder="# of pts" type="number">
    </div>
    <script src="/gallery/voronoi/voronoi.js"></script>
    <script>
        function newDiagram() {
            reset()
            makePoints()
            animate()
        }

        function change() {
            count = document.getElementById("count").value
            newDiagram()
        }

        newDiagram()
    </script>
</body>
</html>
