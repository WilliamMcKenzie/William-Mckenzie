<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/gallery/styles.css">
    <title>WQM</title>
</head>
<body>
    <canvas class="canvas"></canvas>
    <div class="container">
        <h3>
            Quasicrystals (click for special effect)
        </h3>
        <button onclick="window.location.href = '/gallery/vornoi'" class="btn">
            Next
        </button>
        <button onclick="window.location.href = '/'" class="btn">
            Home
        </button><small_break></small_break>
        <input class="input" id="count" onchange="change()" placeholder="seed" type="number" value="7">
    </div>
    <script src="/gallery/quasicrystals/quasicrystals.js"></script>
    <script>
        function change() {
            angles = document.getElementById("count").value
        }
        document.addEventListener("mousedown", (_) => {
            changebg(orangbg)
            fill = [242, 152, 119]
        })
        document.addEventListener("mouseup", (_) => {
            changebg(tealbg)
            fill = [69, 142, 157]
        })
    </script>
</body>
</html>
